name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'badges/**'
      - '**.md'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (headless Chrome)
        run: npm run test:e2e
        env:
          CHROME_BIN: google-chrome
