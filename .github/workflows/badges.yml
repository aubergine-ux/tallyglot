name: Update badges

on:
  schedule:
    - cron: '17 5 * * *' # once a day; anonymous Weblate API access allows 100 requests/day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tallyglot.config.json

permissions:
  contents: write
  issues: write # only used when alerts.channels includes "issue"

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats and render badges
        run: node scripts/build-data.mjs
        env:
          # Optional. JSON object of API tokens keyed by instance id, e.g.
          # {"hosted":"wlu_...","crowdin":"..."}
          TALLYGLOT_TOKENS: ${{ secrets.TALLYGLOT_TOKENS }}
          WEBLATE_TOKENS: ${{ secrets.WEBLATE_TOKENS }} # the 1.0 name, still read
          # Optional. Discord or Slack incoming webhook for alerts.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Used to open an issue when alerts.channels includes "issue".
          GITHUB_TOKEN: ${{ github.token }}
          # Optional repository variable: the dashboard's address when it is not
          # https://<owner>.github.io/<repo>/ (custom domains).
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Commit changes
        run: |
          git add -A data badges cards
          # these exist only when the matching feature is in use
          for path in feed.xml maintainer; do
            if [ -e "$path" ]; then git add -A "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update translation stats and badges"
          git pull --rebase --autostash
          git push
